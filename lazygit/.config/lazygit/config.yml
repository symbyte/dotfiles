gui:
  nerdFontsVersion: "3"
keybinding:
  branches:
    fetchRemote: F
    sortOrder: O
git:
  paging:
    colorArg: always
    # Whole-file additions/deletions unified; modified files side-by-side.
    pager: delta-adaptive --dark --paging=never
  mainBranches:
    - staging
    - master
    - main
    - dev
  skipHookPrefix: WIP
